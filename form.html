<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Quiz 💫 </title>
    <link rel="stylesheet" href="form.css">

</head>
<body>
    <div class="form-container">
        <header class="form-header">
            <h1>Friendship Questions😜✨ </h1><br>
            <p> Answer a few Questions so I can know about you more😜!</p><br>
        </header>
    <form action="https://formspree.io/f/xzezloka" method="post" class="quiz-form">
             <div class="form-group">
                <label for="name">1.what's your nick name❓</label>
                 <input type="text" id="name" name="friend_name" placeholder="type cheyuraa em alo chichuthunnav inka🤨" required><br><br>
                <label>2.what do you think about me🫣</label>
                <input type="text"placeholder="koncham machiga rayandhi na gurinchi🥺"><br><br>
             </div>
            <div class="form-group">
                <label>3.how is your studies going on!</label>
                <div class="options">
                <label class="option-card">
                    <input type="radio" name="studies" value="super🥳">
                    <span>enjoying studies😝</span>
                </label>
                <label class="option-card">
                   <input type="radio" name="studies" value="good🙃">
                    <span>yedho atla chadhuvuthunna🙃</span>
                </label><br>
                <label class="option-card">
                    <input type="radio" name="studies" value="classes ki attendance kosam pothunna raa🫩">
                    <span>attendance kosame kasthaluu anni😣</span>
                </label><br><br>
                <label>4.nalo nik nache behavior yentii❓</label>
                <div class="options">
                    <label class="option-card">
                    <input type="radio" name="behaviour" value="innocent😇" >
                    <span>innocent😇</span>
                </label><br>
                <label class="option-card">
                    <input type="radio" name="behavior" value="funny🤪">
                    <span>funny🤪</span>
                </label><br>
                <label class="option-card">
                    <input type="radio" name="behavior" value="anger😡">
                    <span>anger😡</span>
                </label><br><br>
                </label>
                 </div>
            </div>
    </div>
    <div class="form-group">
        <label for="movie">5.let's go to movie🍿</label>
        <select id="movie" name="movie-name" required>
            <option value="The Paradise">THE PARADISE😎</option>
            <option value="Aadarsha Kutumbam ">"Aadarsha Kutumbam🫠"</option>
            <option value="intrest ledhu">Intrest ledhu🥱</option>
        </select><br><br>
    </div>
    <div class="form-group">
        <label>6.nik nachinna food yentii❓</label>
        <div class="options">
            <label class="option-card">
                <input type="checkbox" name="food" value="biryani😋">
                <span>nak pranam raa biryani</span>
            </label>
            <label class="option-card">
                <input type="checkbox" name="food" value="mandi🍗">
                <span>mandi🍗</span>
            </label>
            <label class="option-card">
                <input type="checkbox" name="food" value="none of the above">
                <span>food medha intrest ledhu raa🥱</span>
            </label><br><br>
        </div>
    </div>
    <div class="form-group">
        <label for="memory">7.what is your favorite memory of us</label>
        <textarea id="momery" name="favorite_memory" rows="4" placeholder="inka alochichu thunnava😱" required></textarea>
    </div>
    <button type="submit" class="submit-btn"> click me to Send responses❤️</button>
    </form>
    </div>

</body>
</html>
